name: Continuous Integration
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verification:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: stepmark_test
          POSTGRES_PASSWORD: stepmark_test
          POSTGRES_DB: stepmark_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U stepmark_test"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 15
    env:
      DATABASE_URL: postgresql://stepmark_test:stepmark_test@localhost:5432/stepmark_test
      APP_ORIGIN: http://localhost:3000
      RATE_LIMIT_SECRET: ci-test-secret-never-use-in-production-1234
      WECHAT_APP_ID: ci_test_appid
      WECHAT_APP_SECRET: ci_test_secret
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm}
      - name: Install pinned dependencies
        run: npm ci --ignore-scripts
      - name: Generate Prisma client
        run: npm run db:generate
      - name: Unit tests
        run: npm run test
      - name: Typecheck
        run: npm run typecheck
      - name: Longitudinal research adapter and rights gate tests
        run: node --import tsx --test packages/core/scripts/evaluate-longitudinal.test.mjs
      - name: Research item-response provenance, isolation and misleading-score regression tests
        run: node --test packages/core/scripts/evaluate-reasoning.test.mjs
      - name: WeChat JavaScript syntax check
        run: |
          node --check apps/wechat-miniapp/app.js
          node --check apps/wechat-miniapp/pages/index/index.js
      - name: Mini-program structural and mobile layout contract checks
        run: node --test apps/wechat-miniapp/scripts/verify-layout.test.mjs
      - name: Deploy committed database migrations to clean PostgreSQL
        run: npm run db:deploy --workspace @stepmark/web
      - name: Seed original demonstration tasks
        run: npm run db:seed --workspace @stepmark/web
      - name: Multiuser integration tests
        run: npm run test:integration --workspace @stepmark/web
      - name: Production build
        run: npm run build
      - name: Security dependency audit
        run: npm audit --omit=dev --audit-level=high
