name: Windows Desktop
on:
  push:
    paths:
      - 'apps/desktop/**'
      - '.github/workflows/desktop-windows.yml'
      - 'apps/web/src/server/desktop-auth.ts'
      - 'apps/web/src/app/api/v1/auth/desktop/**'
      - 'apps/web/src/server/security.ts'
  pull_request:
    paths:
      - 'apps/desktop/**'
      - '.github/workflows/desktop-windows.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-compile:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      # Domain approved by the StepMark owner. Do not replace with a PR input.
      STEPMARK_API_ORIGIN: https://stepmark.xin
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - name: Rust tests with production Tauri protocol
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --features custom-protocol
      - name: Verify bundled UI and domain policy
        run: |
          node --check apps/desktop/ui/app.js
          node --test apps/desktop/scripts/verify-desktop.test.mjs
      - name: Build unsigned Windows NSIS preview installer for stepmark.xin
        if: github.event_name != 'pull_request'
        working-directory: apps/desktop
        run: npx --yes @tauri-apps/cli@2 build --ci
      - name: Verify installer size and publish SHA-256 checksum
        if: github.event_name != 'pull_request'
        shell: pwsh
        run: |
          $files = @(Get-ChildItem 'apps/desktop/src-tauri/target/release/bundle/nsis' -Filter '*.exe' -File)
          if ($files.Count -ne 1) { throw 'Expected exactly one Windows NSIS installer' }
          $file = $files[0]
          if ($file.Length -lt 1048576) { throw 'Installer unexpectedly small' }
          $sha = (Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$sha  $($file.Name)" | Out-File -FilePath (Join-Path $file.DirectoryName 'SHA256SUMS.txt') -Encoding ascii
          Write-Host "Windows preview installer: $($file.Name)"
          Write-Host "SHA256: $sha"
          Write-Host 'Preview only: this build is NOT code-signed.'
      - name: Probe public HTTPS and unauthenticated API readiness
        if: github.event_name != 'pull_request'
        continue-on-error: true
        run: node apps/desktop/scripts/check-deployment.mjs
      - name: Upload unsigned Windows installer (preview only)
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: StepMark-Windows-stepmark.xin-unsigned-preview
          path: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/nsis/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
