name: Windows Desktop
on:
  push:
    paths:
      - 'apps/desktop/**'
      - '.github/workflows/desktop-windows.yml'
      - 'apps/web/src/server/desktop-auth.ts'
      - 'apps/web/src/app/api/v1/auth/desktop/**'
      - 'apps/web/src/server/security.ts'
  pull_request:
    paths:
      - 'apps/desktop/**'
      - '.github/workflows/desktop-windows.yml'
  workflow_dispatch:
    inputs:
      api_origin:
        description: 'Production/staging HTTPS API origin; unsigned preview only'
        required: true
        type: string
permissions:
  contents: read
jobs:
  windows-compile:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - name: Rust tests and Windows compilation
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml
      - name: Validate manual packaging API origin
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        env:
          STEPMARK_API_ORIGIN: ${{ inputs.api_origin }}
        run: |
          $uri = [Uri]$env:STEPMARK_API_ORIGIN
          $authority = $uri.GetLeftPart([UriPartial]::Authority).TrimEnd('/')
          if ($uri.Scheme -ne 'https' -or $authority -ne $env:STEPMARK_API_ORIGIN -or $uri.Port -ne 443 -or $uri.UserInfo -or $uri.Host -eq 'localhost' -or $uri.Host -match '^\d+\.\d+\.\d+\.\d+
            throw 'A real HTTPS origin without path/query/fragment is required'
          }
      - name: Build unsigned Windows NSIS preview installer
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        env:
          STEPMARK_API_ORIGIN: ${{ inputs.api_origin }}
        working-directory: apps/desktop
        run: npx --yes @tauri-apps/cli@2 build --ci
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: StepMark-Windows-unsigned-preview
          path: apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 7
) {
            throw 'A real HTTPS origin without path/query/fragment is required'
          }
      - name: Build unsigned Windows NSIS preview installer
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        env:
          STEPMARK_API_ORIGIN: ${{ inputs.api_origin }}
        working-directory: apps/desktop
        run: npx --yes @tauri-apps/cli@2 build --ci
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: StepMark-Windows-unsigned-preview
          path: apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 7
