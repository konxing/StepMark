name: ICAR SAPA isolated 1PL and 2PL research benchmark
on:
  push:
    paths:
      - "packages/core/scripts/validate-icar.py"
      - "packages/core/scripts/test_validate_icar.py"
      - "packages/core/scripts/fetch-icar-irw.R"
      - ".github/workflows/research-icar.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  research-only:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned numerical libraries
        run: python -m pip install numpy==2.1.3 scipy==1.14.1
      - name: Verify synthetic IRT regressions and invalid-source guard
        run: python -m unittest discover -s packages/core/scripts -p 'test_validate_icar.py' -v
      - name: Install required system headers for IRW package dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libcurl4-openssl-dev libssl-dev libxml2-dev
      - name: Install and verify review-pinned IRW R client
        run: Rscript -e 'install.packages("irw", repos="https://cloud.r-project.org", Ncpus=2); stopifnot(requireNamespace("irw", quietly=TRUE), as.character(utils::packageVersion("irw")) == "1.4.0")'
      - name: Extract pinned CC0 ICAR response rows (no test text)
        run: Rscript packages/core/scripts/fetch-icar-irw.R "$RUNNER_TEMP/stepmark-icar.csv"
      - name: Run respondent- and item-heldout validation with only aggregate output
        run: python packages/core/scripts/validate-icar.py "$RUNNER_TEMP/stepmark-icar.csv"
      - name: Delete temporary respondent rows
        if: always()
        run: rm -f "$RUNNER_TEMP/stepmark-icar.csv"
