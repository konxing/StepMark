name: ICAR SAPA isolated 1PL and 2PL research benchmark
on:
  push:
    paths:
      - "packages/core/scripts/validate-icar.py"
      - "packages/core/scripts/test_validate_icar.py"
      - "packages/core/scripts/fetch-icar-dataverse.py"
      - ".github/workflows/research-icar.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  research-only:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned numerical libraries
        run: python -m pip install numpy==2.1.3 scipy==1.14.1
      - name: Synthetic IRT and invalid-source regression tests
        run: python -m unittest discover -s packages/core/scripts -p 'test_validate_icar.py' -v
      - name: Download and SHA-256 verify Harvard Dataverse CC0 scored ICAR responses
        run: python packages/core/scripts/fetch-icar-dataverse.py "$RUNNER_TEMP/stepmark-icar.csv"
      - name: Run independent-respondent and held-out-item predictive benchmark
        run: python packages/core/scripts/validate-icar.py "$RUNNER_TEMP/stepmark-icar.csv"
      - name: Delete source response CSV from ephemeral runner
        if: always()
        run: rm -f "$RUNNER_TEMP/stepmark-icar.csv"
