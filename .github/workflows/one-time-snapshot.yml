name: One-time reproducibility snapshot
on:
  push:
    branches: ['feat/research-backed-foundation']
    paths: ['.github/workflows/one-time-snapshot.yml']
permissions:
  contents: write
jobs:
  snapshot:
    if: github.repository == 'konxing/StepMark' && github.actor == 'konxing' && github.event.head_commit.message == 'chore: run one-time snapshot'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env: {POSTGRES_USER: stepmark_test, POSTGRES_PASSWORD: stepmark_test, POSTGRES_DB: stepmark_test}
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U stepmark_test"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 15
    env:
      DATABASE_URL: postgresql://stepmark_test:stepmark_test@localhost:5432/stepmark_test
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: true}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Install and generate migration
        run: |
          npm install --ignore-scripts
          npm run db:migrate --workspace @stepmark/web -- --name init --create-only
      - name: Commit only generated lockfile and migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- package-lock.json apps/web/prisma/migrations/
          git diff --cached --exit-code && exit 0
          git commit -m "build: lock dependencies and initial PostgreSQL migration"
          git push origin HEAD:feat/research-backed-foundation
