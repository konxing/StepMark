name: Fiorella 2026 longitudinal automaticity research benchmark
on:
  push:
    paths:
      - "packages/core/scripts/validate-fiorella.mjs"
      - ".github/workflows/research-fiorella.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  research-only:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm}
      - name: Install pinned workspace dependencies
        run: npm ci --ignore-scripts
      - name: Validate independent 2026 habit automaticity cohorts with time-forward holdouts
        run: node --import tsx packages/core/scripts/validate-fiorella.mjs
