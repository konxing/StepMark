name: One-time cleanup of merged StepMark branches
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/prune-merged-branches.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  prune:
    if: github.repository == 'konxing/StepMark' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Delete only reviewed, already merged branch heads
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          while IFS=' ' read -r branch expected; do
            current=$(gh api "repos/$GH_REPO/git/ref/heads/$branch" --jq '.object.sha')
            if [[ "$current" != "$expected" ]]; then
              echo "Ref changed for $branch; refusing to delete" >&2
              exit 1
            fi
            if ! git merge-base --is-ancestor "$expected" "$GITHUB_SHA"; then
              echo "Unmerged commit on $branch; refusing to delete" >&2
              exit 1
            fi
            gh api --method DELETE "repos/$GH_REPO/git/refs/heads/$branch"
            echo "Deleted fully merged branch: $branch"
          done <<'BRANCHES'
          feat/research-backed-foundation ac7d2c25f61e33594aa065f2f4b11302ce3514f4
          feat/audited-opportunity-corrections 43963aaa6e43a856db2123ec46c87f6c2b7f7346
          BRANCHES
