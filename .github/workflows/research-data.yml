name: Reproducible public research dataset benchmark
on:
  push:
    paths:
      - "packages/core/scripts/validate-habitapp.mjs"
      - "packages/core/scripts/validate-habitapp.test.mjs"
      - "packages/core/scripts/evaluate-reasoning.mjs"
      - "packages/core/scripts/evaluate-reasoning.test.mjs"
      - "packages/core/scripts/validate-bfi.mjs"
      - "packages/core/scripts/validate-bfi.test.mjs"
      - ".github/workflows/research-data.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  habitapp-public-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Verify parser, ownership-free source validation and tamper detection
        run: node --test packages/core/scripts/validate-habitapp.test.mjs
      - name: Verify cross-construct evidence gates for reasoning forms
        run: node --test packages/core/scripts/evaluate-reasoning.test.mjs
      - name: Verify open psychological scale reliability diagnostics
        run: node --test packages/core/scripts/validate-bfi.test.mjs
      - name: Download pinned public R psych BFI demonstration data, verify Git checksum and print aggregate scale diagnostics
        run: node packages/core/scripts/validate-bfi.mjs
      - name: Download pinned public research CSV, verify Git blob checksum and output aggregated contrasts only
        run: node packages/core/scripts/validate-habitapp.mjs
