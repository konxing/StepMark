name: PERSUADE 2.0 discourse-unit academic research only
on:
  push:
    paths:
      - "packages/core/scripts/validate-persuade-discourse.py"
      - "packages/core/scripts/test_validate_persuade_discourse.py"
      - ".github/workflows/research-persuade-discourse.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  noncommercial-research-only:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install pinned offline classification libraries
        run: python -m pip install numpy==2.1.3 scipy==1.14.1 scikit-learn==1.5.2
      - name: Test CC BY NC data handling, label mapping and essay-disjoint partitions
        run: python -m unittest discover -s packages/core/scripts -p 'test_validate_persuade_discourse.py' -v
      - name: Download immutable research-only PERSUADE 2.0 four-prompt subset and validate discourse labels
        run: python packages/core/scripts/validate-persuade-discourse.py
