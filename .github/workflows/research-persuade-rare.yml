name: PERSUADE academic rare-class leave-one-prompt-out research
on:
  push:
    paths:
      - "packages/core/scripts/validate-persuade-discourse.py"
      - "packages/core/scripts/validate-persuade-rare.py"
      - "packages/core/scripts/test_validate_persuade_rare.py"
      - ".github/workflows/research-persuade-rare.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  noncommercial-research-only:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned research-only dependencies
        run: python -m pip install numpy==2.1.3 scipy==1.14.1 scikit-learn==1.5.2
      - name: Validate label weighting, unseen-prompt folds and leakage checks
        run: python -m unittest discover -s packages/core/scripts -p 'test_validate_persuade_rare.py' -v
      - name: Compare class weight variants on completely held-out topic prompts
        run: python packages/core/scripts/validate-persuade-rare.py
