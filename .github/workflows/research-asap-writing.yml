name: ASAP 2.0 human-scored writing research
on:
  push:
    paths:
      - "packages/core/scripts/validate-asap-writing.py"
      - "packages/core/scripts/test_validate_asap_writing.py"
      - ".github/workflows/research-asap-writing.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  research-only:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned offline text-analysis dependencies
        run: python -m pip install numpy==2.1.3 scipy==1.14.1 scikit-learn==1.5.2
      - name: Run synthetic score, provenance and no-leakage regression tests
        run: python -m unittest discover -s packages/core/scripts -p 'test_validate_asap_writing.py' -v
      - name: Download publisher-pinned CC BY 4.0 training archive, compare automated and human ratings
        run: python packages/core/scripts/validate-asap-writing.py
