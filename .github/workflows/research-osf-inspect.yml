name: Research OSF dataset schema inspection
on:
  push:
    paths:
      - "packages/core/scripts/inspect-osf-data.mjs"
      - "packages/core/scripts/inspect-fiorella.py"
      - ".github/workflows/research-osf-inspect.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Inspect fixed public research files in ephemeral runner (no participant rows logged)
        run: node packages/core/scripts/inspect-osf-data.mjs

      - name: Validate Fiorella 2026 anonymized daily CSV tables and raw ZIP integrity
        run: python3 packages/core/scripts/inspect-fiorella.py
