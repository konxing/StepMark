<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>StepMark</title>
  <link rel="stylesheet" href="./style.css">
  <script src="./app.js" defer></script>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand"><span class="brand-symbol" aria-hidden="true">S</span>StepMark</div>
      <nav aria-label="主要导航" class="navigation">
        <button type="button" data-view="workspace" aria-current="page">工作台</button>
        <button type="button" data-view="habits">习惯成长</button>
        <button type="button" data-view="connections">连接设置</button>
      </nav>
      <div class="sidebar-bottom">
        <span id="connection-indicator" class="indicator" aria-hidden="true"></span>
        <span id="connection-status">检查 AI 连接</span>
      </div>
    </aside>

    <main class="content">
      <section id="view-workspace" class="workspace" aria-labelledby="workspace-title">
        <header class="topline">
          <h1 id="workspace-title">工作台</h1>
          <button id="new-problem" type="button" class="quiet" hidden>新问题</button>
        </header>
        <div class="work-area">
          <div id="welcome" class="welcome">
            <h2>哪件事卡住了？</h2>
            <p>说说你在做什么、卡在哪里。一起弄清问题，先做出一份可以用的东西。</p>
            <div class="examples" aria-label="从哪里开始">
              <button type="button" data-starter="说一说遇到的问题，以及你已经观察到了什么。">
                <strong>弄清问题</strong><span>梳理事实、假设和待验证的地方</span>
              </button>
              <button type="button" data-starter="描述你想做成什么、现在做到哪里了，以及希望我帮你推进的部分。">
                <strong>推进一件事</strong><span>把想法变成可执行的下一步</span>
              </button>
              <button type="button" data-starter="说说原本想达到什么、实际发生了什么，以及你想从结果里弄清什么。">
                <strong>回顾结果</strong><span>从实际结果里找出下次可改的地方</span>
              </button>
            </div>
          </div>
          <div id="conversation" class="conversation" aria-label="工作记录" hidden></div>
          <form id="composer" class="composer">
            <label for="question" id="composer-label">你的问题</label>
            <textarea id="question" name="question" maxlength="4000" rows="3" placeholder="例如，遇到了什么现象？你希望产出什么？" required></textarea>
            <div class="composer-actions">
              <span id="composer-help">发送后，当前问题和最近对话会发给 DeepSeek。</span>
              <button id="send" type="submit" class="primary">交给 AI</button>
            </div>
            <div id="ai-unavailable" class="inline-notice" hidden>
              <span id="ai-unavailable-copy">连接 DeepSeek 后即可开始。</span>
              <button id="open-connection" type="button" class="quiet">连接设置</button>
            </div>
            <p id="work-status" class="status-line" role="status" aria-live="polite"></p>
          </form>
        </div>
      </section>

      <section id="view-habits" class="secondary-view" aria-labelledby="habits-title" hidden>
        <header class="topline"><h1 id="habits-title">习惯成长</h1><button id="refresh" type="button" class="quiet" hidden>刷新</button></header>
        <div class="panel">
          <p id="list-hint">连接 StepMark 账号后查看已记录的习惯。</p>
          <div id="habit-list" class="habit-list"></div>
          <p id="habit-status" class="status-line" role="status"></p>
          <button id="habit-login" type="button" class="primary">连接 StepMark 账号</button>
          <button id="open-assessments" type="button" class="quiet" hidden>打开对话成长控制台</button>
        </div>
      </section>

      <section id="view-connections" class="secondary-view" aria-labelledby="connections-title" hidden>
        <header class="topline"><h1 id="connections-title">连接设置</h1></header>
        <div class="connection-panels">
          <section class="panel" aria-labelledby="ai-title">
            <div class="panel-heading"><h2 id="ai-title">DeepSeek Flash</h2><span id="provider-label" class="subtle"></span></div>
            <p>本机直接连接 DeepSeek。密钥经验证后保存在 Windows 凭据管理器。</p>
            <form id="key-form" autocomplete="off">
              <label for="api-key">DeepSeek API Key</label>
              <input id="api-key" name="api-key" type="password" autocomplete="off" spellcheck="false" maxlength="180" placeholder="sk-…" required>
              <div class="actions">
                <button id="save-key" type="submit" class="primary">验证并保存</button>
                <button id="test-key" type="button" class="quiet" hidden>测试连接</button>
                <button id="clear-key" type="button" class="quiet" hidden>移除密钥</button>
              </div>
            </form>
            <p id="key-status" class="status-line" role="status" aria-live="polite"></p>
          </section>
          <section class="panel" aria-labelledby="account-title">
            <div class="panel-heading"><h2 id="account-title">StepMark 账号</h2><span id="api-label" class="subtle"></span></div>
            <p id="account-name">未连接。连接账号后可查看习惯记录。</p>
            <div class="actions">
              <button id="login" type="button" class="primary">在浏览器登录</button>
              <button id="logout" type="button" class="quiet" hidden>注销</button>
            </div>
            <p id="account-status" class="status-line" role="status"></p>
          </section>
        </div>
      </section>
    </main>
  </div>
</body>
</html>
