# Single ECS instance preview; PostgreSQL is an external, managed service.
# The origin is not published on port 3000. Only Caddy binds host ports.
name: stepmark
services:
  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    init: true
    env_file:
      - ./production.env
    environment:
      NODE_ENV: production
      APP_ORIGIN: https://stepmark.xin
      # Caddy overwrites X-Real-IP using the direct TCP peer.
      TRUSTED_CLIENT_IP_HEADER: x-real-ip
      PORT: "3000"
      HOSTNAME: 0.0.0.0
    expose:
      - "3000"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - private
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(async r=>process.exit(r.ok && (await r.json()).status==='ok'?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  proxy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    security_opt:
      - no-new-privileges:true
    networks:
      - private

networks:
  private:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
